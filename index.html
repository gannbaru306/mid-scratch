<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MIDI to Scratch by gannbaru306</title>
  <script src="https://unpkg.com/picoaudio/dist/browser/PicoAudio.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #drop-zone { border: 2px dashed #aaa; padding: 40px; text-align: center; color: #666; cursor: pointer; margin-bottom: 20px; }
    #drop-zone.dragover { border-color: #00aaff; background-color: #f0f8ff; }
    #log { background: #f4f4f4; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap; height: 200px; overflow-y: auto; margin-top: 10px; }
    .option-group { margin-bottom: 15px; padding: 10px; background: #eef2f5; border-radius: 5px; }
    .option-group label { margin-right: 15px; cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <h2>MIDI変換ツールv4.9</h2>
  <p style="margin-bottom: 15px;">
  <a href="https://scratch.mit.edu/projects/1221707096/" target="_blank" rel="noopener noreferrer">こちら</a>でデータを読み込んで演奏することができます。
  </p>
  <div id="drop-zone">ここをクリックするか、MIDIファイルをドラッグしてください</div>
  <input type="file" id="midiFile" accept=".mid,.midi" style="display:none;" />
  
  <div class="option-group">
    <strong>変換設定:</strong><br>
    <label><input type="checkbox" id="enableMerge" checked> 同種楽器の統合</label>
    <label><input type="checkbox" id="enableDistribute" checked> 高密度トラックの自動分散</label>
  </div>

  <button id="convertBtn">変換してダウンロード</button>
  <div id="player-controls" style="margin-top: 15px;">
    <button id="playBtn">再生</button>
    <button id="pauseBtn">一時停止</button>
  </div>
  <label for="volumeSlider">音量</label>
  <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
  <pre id="log">ログ出力エリア</pre>

  <script>
    const picoAudio = new PicoAudio();
    let midiLoaded = false;
    let currentVolume = 0.5;
    let midi = null;
    const log = document.getElementById("log");

    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("midiFile");

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      const file = e.dataTransfer.files[0];
      if (file) {
        try { fileInput.files = e.dataTransfer.files; } catch (err) {}
        handleFile(file);
      }
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    async function handleFile(file) {
      try {
        log.textContent = `読み込み中: ${file.name}...`;
        const arrayBuffer = await file.arrayBuffer();
        if (typeof Midi === 'undefined') throw new Error("Midiライブラリが読み込まれていません。");

        midi = new Midi(arrayBuffer);
        await picoAudio.init();
        picoAudio.setData(picoAudio.parseSMF(arrayBuffer));
        midiLoaded = true;
        log.textContent += "\n再生準備完了";
      } catch (error) {
        log.textContent += `\n【エラー】ファイルの処理に失敗しました:\n${error.message}`;
      }
    }

    document.getElementById("playBtn").addEventListener("click", () => {
      if (!midiLoaded) { log.textContent += "\nMIDIファイルを読み込んでください"; return; }
      picoAudio.play();
      log.textContent += "\n再生開始";
    });

    document.getElementById("pauseBtn").addEventListener("click", () => {
      picoAudio.stop();
      log.textContent += "\n一時停止しました";
    });

    document.getElementById("volumeSlider").addEventListener("input", (e) => {
      currentVolume = parseFloat(e.target.value);
      picoAudio.setMasterVolume(currentVolume);
    });

    const gmToScratchId = gm => {
      if (gm < 4) return 1; if (gm < 7) return 2; if (gm < 12) return 17; if (gm === 12) return 16;
      if (gm === 13) return 19; if (gm === 14) return 16; if (gm === 15) return 17; if (gm < 20) return 3;
      if (gm < 24) return 6; if (gm < 27) return 4; if (gm < 32) return 5; if (gm < 40) return 6;
      if (gm < 48) return 8; if (gm < 52) return 15; if (gm < 56) return 11; if (gm < 60) return 9;
      if (gm < 65) return 10; if (gm < 68) return 11; if (gm < 72) return 14; if (gm < 75) return 12;
      if (gm < 77) return 13; if (gm < 80) return 13; if (gm < 88) return 20; if (gm < 96) return 21;
      if (gm < 104) return 20; if (gm < 112) return 16; if (gm < 120) return 18; if (gm < 128) return 7;
      return 1;
    };

    const midiToScratchDrum = {
      35: 2, 36: 2,
      38: 1, 40: 1,
      37: 3,
      49: 4, 51: 4, 52: 4, 55: 4, 57: 4, 59: 4,
      46: 5,
      42: 6, 44: 6,
      54: 7,
      39: 8,
      75: 9,
      76: 10, 77: 10,
      56: 11,
      80: 12, 81: 12,
      60: 13, 61: 13,
      62: 14, 63: 14, 64: 14,
      73: 15,
      74: 16,
      58: 17,
      78: 18, 79: 18,
      41: 1, 43: 1, 45: 1, 47: 1, 48: 1, 50: 1
    };

    const customInstruments = {
      "8-bit square": 21, "8-bit sawtooth": 20, "NES triangle": 6, "FM bell": 16,
      "ambient pad": 21, "square lead": 21, "saw lead": 20, "triangle wave": 6,
      "pulse wave": 21, "chip bass": 6, "chip lead": 20, "retro pad": 21,
      "vox": 15, "voice": 15, "pluck": 4, "synth brass": 9, "synth flute": 12,
      "synth choir": 15, "bit crash": 21, "glitch": 21, "laser": 20, "noise": 0,
      "french horn": 9, "english horn": 10, "synth horn": 20, "ambient horn": 21,
      "retro horn": 20, "brass horn": 9
    };

    const normalizeVelocity = v => Math.max(Math.round((v ** 2) * 100), 10);
    const sanitizeLabel = text => text.toLowerCase().replace(/[^a-z0-9]/g, '');

    document.getElementById("convertBtn").addEventListener("click", async () => {
      if (!midi) { alert("MIDIファイルを選択してください"); return; }

      const enableMerge = document.getElementById("enableMerge").checked;
      const enableDistribute = document.getElementById("enableDistribute").checked;

      const trackNotes = {};
      const scratchBpm = 150;

      midi.tracks.forEach((track, i) => {
        const label = `${track.name || `Track${i + 1}`}_Track${i + 1}`;
        const normalizedLabel = sanitizeLabel(label);
        const programNumber = track.instrument?.number ?? null;

        let scratchId = undefined;
        for (const name in customInstruments) {
          if (normalizedLabel.includes(sanitizeLabel(name))) { scratchId = customInstruments[name]; break; }
        }
        if (!scratchId && programNumber !== null) scratchId = gmToScratchId(programNumber);

        // --- ドラム判定ロジック強化部分 ---
        const uniqueNotes = new Set(track.notes.map(n => n.midi));
        const isStandardDrum = 
          track.instrument?.family === "drums" || 
          track.instrument?.number === 128 || 
          track.channel === 9 || 
          track.channel === 10;
        
        // 使われている音の種類が少目（8種類以下）かつ、その全音符がドラム用ノート定義に含まれる場合は分離ドラムとみなす
        const isSplitDrumTrack = 
          uniqueNotes.size > 0 && 
          uniqueNotes.size <= 8 && 
          [...uniqueNotes].every(n => midiToScratchDrum[n] !== undefined);

        const isDrum = isStandardDrum || isSplitDrumTrack;
        // ---------------------------------

        const noteList = [];

        track.notes.forEach(note => {
          const startFrame = Math.round(note.time * 30);
          const durationBeats = (note.duration * scratchBpm) / 60;
          let quantizedBeats = Math.round(durationBeats * 12) / 12;
          if (quantizedBeats <= 0) quantizedBeats = 1 / 12;

          const cleanBeats = Number((Math.round(quantizedBeats * 100) / 100).toFixed(2));
          const volume = normalizeVelocity(note.velocity);

          if (isDrum) {
            const drumId = midiToScratchDrum[note.midi];
            if (drumId) {
              if (!trackNotes["drums"]) trackNotes["drums"] = { scratch_id: 0, notes: [] };
              trackNotes["drums"].notes.push([drumId, startFrame, cleanBeats, volume]);
            }
          } else {
            noteList.push([note.midi, startFrame, cleanBeats, volume]);
          }
        });

        if (!isDrum && noteList.length > 0) trackNotes[label] = { scratch_id: scratchId, notes: noteList };
      });

      const undefinedDrumNotes = new Set();
      midi.tracks.forEach(track => {
        const uniqueNotes = new Set(track.notes.map(n => n.midi));
        const isStandardDrum = track.instrument?.family === "drums" || track.instrument?.number === 128 || track.channel === 9 || track.channel === 10;
        const isSplitDrumTrack = uniqueNotes.size > 0 && uniqueNotes.size <= 8 && [...uniqueNotes].every(n => midiToScratchDrum[n] !== undefined);
        
        if (isStandardDrum || isSplitDrumTrack) {
          track.notes.forEach(note => { if (!midiToScratchDrum[note.midi]) undefinedDrumNotes.add(note.midi); });
        }
      });

      if (undefinedDrumNotes.size > 0) {
        log.textContent += "\n以下の内容をgannbaru306のMIDI再生プログラムのコメント欄に貼り付けてください。\nドラムが正しく認識されませんでした。\n";
        [...undefinedDrumNotes].sort((a, b) => a - b).forEach(n => log.textContent += `${n}\n`);
      }

      log.textContent += "\n変換完了！ノート数:\n"; 
      Object.entries(trackNotes).forEach(([label, data]) => log.textContent += `${label}: ${data.notes.length} notes\n`);

      const validLabels = Object.keys(trackNotes).filter(label => trackNotes[label].notes.length > 0);
      
      const groupedTracks = [];
      if (enableMerge) {
        const groupedByInst = {};
        validLabels.forEach(label => {
          const id = trackNotes[label].scratch_id;
          if (!groupedByInst[id]) groupedByInst[id] = [];
          groupedByInst[id].push(...trackNotes[label].notes);
        });
        Object.keys(groupedByInst).forEach(id => {
          groupedTracks.push({ scratch_id: parseInt(id, 10), notes: groupedByInst[id] });
        });
      } else {
        validLabels.forEach(label => {
          groupedTracks.push({ scratch_id: trackNotes[label].scratch_id, notes: trackNotes[label].notes });
        });
      }

      groupedTracks.forEach(group => {
        group.notes.sort((a, b) => a[1] - b[1]);
        const frameCounts = {};
        let maxC = 0;
        group.notes.forEach(n => {
          const f = n[1];
          frameCounts[f] = (frameCounts[f] || 0) + 1;
          if (frameCounts[f] > maxC) maxC = frameCounts[f];
        });
        group.maxSimultaneous = maxC;
      });

      let isBlackMidi = groupedTracks.some(g => g.maxSimultaneous >= 10);

      let droppedTracks = [];
      let targetTracks = groupedTracks;
      if (targetTracks.length > 15) {
        targetTracks.sort((a, b) => b.notes.length - a.notes.length);
        droppedTracks = targetTracks.slice(15);
        targetTracks = targetTracks.slice(0, 15);
      }

      const finalTrackList = [];
      if (enableDistribute && isBlackMidi) {
        const allocatedSlots = targetTracks.map(() => 1);
        let remainingSlots = 15 - targetTracks.length;

        while (remainingSlots > 0) {
          let bestIdx = -1;
          let maxCurrentPerSlot = 0;

          targetTracks.forEach((tr, idx) => {
            if (tr.maxSimultaneous >= 10) {
              const currentPerSlot = tr.maxSimultaneous / allocatedSlots[idx];
              if (currentPerSlot > 5 && currentPerSlot > maxCurrentPerSlot) {
                maxCurrentPerSlot = currentPerSlot;
                bestIdx = idx;
              }
            }
          });

          if (bestIdx === -1) break;
          allocatedSlots[bestIdx]++;
          remainingSlots--;
        }

        targetTracks.forEach((tr, idx) => {
          const slotsCount = allocatedSlots[idx];
          if (slotsCount === 1) {
            finalTrackList.push({ scratch_id: tr.scratch_id, notes: tr.notes });
          } else {
            const subTracks = Array.from({ length: slotsCount }, () => []);
            let currentFrame = null;
            let frameNoteIndex = 0;

            tr.notes.forEach(note => {
              const frame = note[1];
              if (frame !== currentFrame) {
                currentFrame = frame;
                frameNoteIndex = 0;
              }
              subTracks[frameNoteIndex % slotsCount].push(note);
              frameNoteIndex++;
            });

            subTracks.forEach(sNotes => {
              if (sNotes.length > 0) finalTrackList.push({ scratch_id: tr.scratch_id, notes: sNotes });
            });
          }
        });
        log.textContent += "\nトラックを自動分散しました。\n";
      } else {
        targetTracks.forEach(tr => finalTrackList.push({ scratch_id: tr.scratch_id, notes: tr.notes }));
        if (isBlackMidi) {
          log.textContent += "\n設定により自動分散されませんでした。\n";
        } else {
          log.textContent += "\n自動分散しませんでした。\n";
        }
      }

      if (droppedTracks.length > 0) {
        log.textContent += "scratchで再生すると以下のトラックが抜け落ちます:\n";
        droppedTracks.forEach(tr => log.textContent += `楽器番号 ${tr.scratch_id} (${tr.notes.length}音)\n`);
      }

      const lines = [];
      finalTrackList.forEach(tr => lines.push(`${tr.scratch_id}`));
      lines.push("/");

      finalTrackList.forEach(tr => {
        tr.notes.forEach(([note, frame, beats, volume]) => {
          lines.push(`${note}/${frame}/${beats}/${volume}`);
        });
        lines.push("/");
      });

      const finalText = lines.join("\n");
      const timestamp = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 15);
      const blob = new Blob([finalText], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `combined_notes_${timestamp}.txt`;
      link.click();
    });
  </script>
</body>
</html>
